name: PhotoCleaner
options:
  bundleIdPrefix: com.localphototools
  deploymentTarget:
    iOS: "18.0"
packages:
  PhotoCleanerCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "0.2.0"
targets:
  PhotoCleaner:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: PhotoCleanerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localphototools.PhotoCleaner
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - PhotoCleanerTests
        - PhotoCleanerUITests
  PhotoCleanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
      - path: App/LocalIndex.swift
    dependencies:
      - package: PhotoCleanerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localphototools.PhotoCleanerTests
        GENERATE_INFOPLIST_FILE: YES
  PhotoCleanerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PhotoCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localphototools.PhotoCleanerUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotoCleaner
